name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t student-results-portal .
      - name: Smoke test the image
        run: |
          docker run -d --name portal -p 3000:3000 student-results-portal
          for i in $(seq 1 30); do curl -sf localhost:3000/api/health && break; sleep 1; done
          docker exec portal node scripts/seed.ts --rows 500 --load
          curl -sf localhost:3000/students > /dev/null
